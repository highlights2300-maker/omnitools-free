<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're offline — QuickZeta</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020617;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
    }
    .logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #fbbf24;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .logo svg { width: 28px; height: 28px; fill: #0f172a; }
    h1 { font-size: 1.25rem; font-weight: 800; margin: 0 0 8px; }
    p { font-size: 0.9rem; color: #94a3b8; line-height: 1.6; margin: 0 0 20px; }
    button {
      background: #fbbf24;
      color: #0f172a;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #fcd34d; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M13 2L4 14H10L9 22L20 9H13L13 2Z" />
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>
      This page hasn't been saved for offline use yet. Reconnect to the internet and try again —
      or open a tool you've already visited before, since those work without a connection.
    </p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
